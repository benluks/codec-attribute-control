defaults:
  - dataset: librispeech
  - f0: online
  - optimization: adamw_cosine
  - head: mlp
  - _self_

data_root: ???
f0_cache_root: ./outputs/precomputed/f0/jdc
batch_size: 8
num_workers: 24
max_epochs: 10
learning_rate: 0.0003
weight_decay: 0.01
target_mode: normalized_log2  # normalized_log2 or log2 (absolute log2 Hz)

experiment_name: facodec-f0-${hydra:runtime.choices.head}-ctx${oc.select:head.context_size,na}-hidden${oc.select:head.hidden_sizes,na}-${oc.select:head.activation,na}-${target_mode}-${hydra:runtime.choices.dataset}-${train_split}-to-${val_split}
train_split: train-clean-100
val_split: dev-clean

system:
  _target_: codec_attribute_control.system.F0ProbeSystem
  encoder:
    _target_: codec_attribute_control.facodec_encoder.FACodecContentEncoder
    batched: true
  head: ${head}
  freeze_encoder: true
  online_encoders: ${f0.online_encoders}

trainer:
  _target_: quick_convert.training.lightning.trainer.LightningTrainer
  module:
    _target_: codec_attribute_control.training.F0ProbeTrainingModule
    system: ${system}
    optimization: ${optimization}
    target_mode: ${target_mode}
  train_dataloader_kwargs:
    batch_size: ${batch_size}
    shuffle: true
    num_workers: ${num_workers}
  val_dataloader_kwargs:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  trainer_kwargs:
    max_epochs: ${max_epochs}
    log_every_n_steps: 1
    accelerator: auto
    devices: 1
    logger:
      _target_: lightning.pytorch.loggers.WandbLogger
      _partial_: true
      project: codec-attribute-control
      name: ${experiment_name}
      save_dir: ${hydra:runtime.output_dir}
    callbacks:
      - _target_: lightning.pytorch.callbacks.LearningRateMonitor
        logging_interval: step
      - _target_: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: val/${target_mode}_f0_mae
        mode: min
        save_last: false
        save_top_k: 1
        filename: best
      - _target_: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: epoch
        mode: max
        save_top_k: 2
        every_n_epochs: 1
        save_on_train_epoch_end: true
        filename: 'recent-{epoch:03d}'
        auto_insert_metric_name: false

hydra:
  run:
    dir: outputs
  job:
    chdir: false
