defaults:
  - dataset: audio
  - optimization: adamw_cosine
  - _self_

seed: 42
val_fraction: 0.2
batch_size: 1
num_workers: 0
max_epochs: 10
learning_rate: 0.0003
weight_decay: 0.01

# The training module expects a batch with audio, aligned f0_hz, and
# f0_lengths. The current audio dataset does not yet provide these.
system:
  _target_: codec_attribute_control.system.F0ProbeSystem
  encoder:
    _target_: codec_attribute_control.facodec_encoder.FACodecContentEncoder
    device: cpu
  head:
    _target_: codec_attribute_control.head.LinearF0Head
    input_dim: 256
  freeze_encoder: true

trainer:
  _target_: quick_convert.training.lightning.trainer.LightningTrainer
  module:
    _target_: codec_attribute_control.training.F0ProbeTrainingModule
    system: ${system}
    optimization: ${optimization}
  train_dataloader_kwargs:
    batch_size: ${batch_size}
    shuffle: true
    num_workers: ${num_workers}
  val_dataloader_kwargs:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  trainer_kwargs:
    max_epochs: ${max_epochs}
    accelerator: auto
    devices: 1
    callbacks:
      - _target_: lightning.pytorch.callbacks.ModelCheckpoint
        monitor: val/mae
        mode: min
        save_last: true
        save_top_k: 1
        filename: best

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
