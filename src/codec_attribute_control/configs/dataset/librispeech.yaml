# LibriSpeech selection; QC's BaseDataset handles file discovery and audio.
_target_: quick_convert.data.BaseDataset
root: ${data_root}
splits: [train-clean-100]
file_format: flac
utt_id_template: "{path.stem}"
load: [audio, f0]
target_sr: 16000
convert_to_mono: true
resource_providers:
  - _target_: quick_convert.data.resources.PathResourceProvider
    name: f0
    kind: torch_tensor
    path_template: ${f0_cache_root}/{sample.split}/{sample.utt_id}.pt
