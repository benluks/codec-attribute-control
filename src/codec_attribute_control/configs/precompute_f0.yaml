defaults:
  - dataset: librispeech
  - _self_

data_root: ???
f0_cache_root: ./outputs/precomputed/f0/jdc
splits: [train-clean-100, dev-clean]
batch_size: 128
num_workers: 24
device: cuda
checkpoint_path: null
cache_key: null

dataset:
  splits: ${splits}
  load: [audio]
  target_sr: 16000

pipeline:
  _target_: quick_convert.pipelines.precompute_features.PrecomputeFeaturesPipeline
  dataset: ${dataset}
  extractor:
    _target_: codec_attribute_control.f0_precompute_extractor.JDCF0PrecomputeExtractor
    checkpoint_path: ${checkpoint_path}
    device: ${device}
  out_dir: ${f0_cache_root}
  batch_size: ${batch_size}
  num_workers: ${num_workers}
  skip_existing: true
  cache_key: ${cache_key}

hydra:
  run:
    dir: outputs
  job:
    chdir: false
