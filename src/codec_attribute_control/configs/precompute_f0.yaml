defaults:
  - dataset: librispeech
  - _self_

data_root: ???
f0_backend: jdc
f0_cache_root: ./outputs/precomputed/f0/${f0_backend}
splits: [train-clean-100, dev-clean]
batch_size: 8
num_workers: 4
pitch_workers: 1
num_shards: 1
shard_index: 0
device: cuda
checkpoint_path: null
cache_key: null

dataset:
  splits: ${splits}
  load: [audio]
  target_sr: 16000

pipeline:
  _target_: codec_attribute_control.f0_precompute_extractor.PitchPrecomputePipeline
  dataset: ${dataset}
  extractor:
    _target_: codec_attribute_control.f0_precompute_extractor.F0PrecomputeExtractor
    backend: ${f0_backend}
    checkpoint_path: ${checkpoint_path}
    device: ${device}
  out_dir: ${f0_cache_root}
  batch_size: ${batch_size}
  num_workers: ${num_workers}
  skip_existing: true
  cache_key: ${cache_key}

run:
  pitch_workers: ${pitch_workers}
  num_shards: ${num_shards}
  shard_index: ${shard_index}

hydra:
  run:
    dir: outputs
  job:
    chdir: false
