[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codec-attribute-control"
version = "0.1.0"
description = "Frozen neural-codec latent probes and attribute interventions"
requires-python = ">=3.11"
dependencies = [
  "quick-convert @ git+https://github.com/benluks/quick-convert.git",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "huggingface-hub>=0.23",
  "librosa>=0.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
yaapt = ["amfm-decompy>=1.0.12"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
codec-attribute-control = "codec_attribute_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codec_attribute_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
