[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "codec-attribute-control"
version = "0.1.0"
description = "Frozen neural-codec latent probes and attribute interventions"
requires-python = ">=3.11,<3.14"
dependencies = [
  "quick-convert @ git+https://github.com/benluks/quick-convert.git",
  "numpy>=1.26",
  "hydra-core>=1.3",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "soundfile>=0.12",
]

[project.optional-dependencies]
yaapt = ["amfm-decompy>=1.0.12"]
train = ["quick-convert[training]", "matplotlib>=3.8", "wandb>=0.17"]
facodec = ["einops>=0.7", "huggingface-hub>=0.20", "safetensors>=0.4", "pyworld>=0.3.4", "setuptools<81", "librosa>=0.10.2"]

[project.scripts]
train-probe = "codec_attribute_control.train:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/codec_attribute_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
